<!DOCTYPE html>
<html>
<head>
  <title>SSV Test Reservations</title>
  <!-- CRITICAL: The GitHub parent page MUST have this for the iframe to scale -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body style="margin:0; padding:0;">
  <iframe 
    src="https://script.google.com/macros/s/AKfycbyAV2LFVMlGIkRHW_iVkl_rYZ9RbJpGoVBaYHFz1nn6rIE9tRZJZyq5Zig4Pc8bqlZCWQ/exec"
    width="100%"
    height="100%"
    allowfullscreen="true"
    style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; border: none;">
  </iframe>

  <script>
    window.onload = function() {
      document.querySelector('iframe')
        .requestFullscreen()
        .catch((err) => {
          console.error('Error attempting to enable full-screen mode:', err.message);
        });
    };
  </script>
</body>
</html>
